<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adani Intel Hub</title>
<meta name="description" content="Personal study notes on publicly reported Adani Group news.">
<meta name="theme-color" content="#0E2433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0E2433"/><path d="M8 23 16 8l8 15" fill="none" stroke="#F6F7F2" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="19" r="2.6" fill="#F2A516"/></svg>
  <h1>Adani Intel Hub</h1>
  <div class="fresh" id="fresh" aria-live="polite"></div>
  <button class="iconbtn" id="searchbtn" aria-label="Search everything"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="iconbtn" id="refresh" aria-label="Check for new briefing"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
</header>

<main>
  <section class="view on" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-news" aria-label="News"></section>
  <section class="view" id="v-companies" aria-label="Companies"></section>
  <section class="view" id="v-ops" aria-label="Operations"></section>
  <section class="view" id="v-learn" aria-label="Learn"></section>
  <section class="view" id="v-me" aria-label="Me"></section>
</main>
<div class="sheet" id="sheet"></div>

<div class="player" id="player" role="region" aria-label="Audio player">
  <div class="in">
    <button class="pp" id="pp" aria-label="Pause"></button>
    <div><div class="ti" id="pti"></div><div class="tm" id="ptm"></div></div>
    <button class="sp" id="psp" aria-label="Playback speed">1×</button>
    <button class="x" id="px" aria-label="Close player">✕</button>
    <input type="range" id="pseek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
  </div>
</div>
<audio id="audio" preload="none"></audio>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-v="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="news"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>News</button>
  <button data-v="companies"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Companies</button>
  <button data-v="ops"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ops</button>
  <button data-v="learn"><svg viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3zM21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/></svg>Learn</button>
  <button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script src="diagrams.js"></script>
<script src="app.js"></script>
</body>
</html>
