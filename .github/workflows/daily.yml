# Runs the briefing every morning and publishes docs/ to GitHub Pages.
# Times are UTC.
name: Daily briefing

on:
  schedule:
    - cron: "17 1 * * *"       # 06:47 IST (off the hour: GitHub delays on-the-hour jobs)
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      weekly:
        description: "Also build the week-in-review episode"
        type: boolean
        default: false

permissions: {}               # nothing by default; each job asks only for what it needs

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write          # commit the new data back to the repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Daily/weekly MP3s are NOT committed (git history would balloon). They live in a rolling
      # cache that is restored before the run and re-saved after, so the last 30 days stay online.
      - name: Restore recent episodes
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: |
            docs/audio/daily
            docs/audio/weekly
          key: episodes-${{ github.run_id }}
          restore-keys: episodes-

      - name: Build briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LISTENER_NAME: ${{ vars.LISTENER_NAME }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python pipeline/run.py ${{ inputs.weekly && '--weekly' || '' }}

      - name: Save recent episodes
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: |
            docs/audio/daily
            docs/audio/weekly
          key: episodes-${{ github.run_id }}

      - name: Commit data
        run: |
          git config user.name  "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Briefing $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || echo "push failed; the site still deploys from this run"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
